<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>視訊診間｜名醫診所系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="../images/myLogo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html, body { height: 100%; }
        body { font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">
    <div id="app" class="h-screen flex flex-col">

        <!-- 與診所系統（system.html）一致的頂部橫額 -->
        <nav class="bg-white shadow-lg border-b-4 border-green-500 shrink-0">
            <div class="max-w-7xl mx-auto px-4">
                <div class="flex justify-between items-center py-4">
                    <a href="../index.html" class="flex items-center">
                        <span class="mr-3">
                            <img src="../images/myLogo.png" alt="Logo" class="h-6">
                        </span>
                        <div>
                            <h1 class="text-xl font-bold text-gray-800 leading-tight">名醫診所系統</h1>
                            <p class="text-xs text-gray-500 leading-tight">Dr.Great Clinic</p>
                        </div>
                    </a>
                    <span class="text-sm text-green-700 font-medium">視訊診間</span>
                </div>
            </div>
        </nav>

        <!-- 進入前大廳 -->
        <div id="lobbyScreen" class="flex-1 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-8 text-center">
                <div class="text-5xl mb-4" aria-hidden="true">📹</div>
                <h1 class="text-2xl font-bold text-gray-800">視訊診間</h1>
                <p id="roomCodeLine" class="text-sm text-gray-500 mt-2">
                    診間編號：<span id="roomCodeText" class="font-semibold text-gray-700">—</span>
                </p>
                <p class="text-sm text-gray-600 leading-relaxed mt-5">
                    請於安靜、光線充足的環境就診，<br>
                    進入後請允許瀏覽器使用<b>鏡頭與麥克風</b>。
                </p>
                <button
                    type="button"
                    id="joinRoomBtn"
                    class="mt-6 w-full inline-flex items-center justify-center gap-2 bg-green-600 hover:bg-green-700 text-white text-lg font-semibold px-6 py-3 rounded-xl shadow transition duration-200"
                >
                    <span aria-hidden="true">🚪</span>進入診間
                </button>
                <p class="text-xs text-gray-400 mt-4">建議使用最新版 Chrome、Edge 或 Safari 瀏覽器</p>
            </div>
        </div>

        <!-- 錯誤提示 -->
        <div id="errorScreen" class="hidden flex-1 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-8 text-center">
                <div class="text-5xl mb-4" aria-hidden="true">⚠️</div>
                <h1 class="text-xl font-bold text-gray-800">無法進入診間</h1>
                <p id="errorMessage" class="text-sm text-gray-600 mt-3">連結無效或已過期。</p>
                <p class="text-xs text-gray-400 mt-4">請確認您開啟的是醫師提供的完整連結，或聯絡診所重新索取。</p>
            </div>
        </div>

        <!-- 視訊通話中（原生 SDK 自建介面由 agora-call.js 注入 #roomStage） -->
        <div id="callScreen" class="hidden flex-1 min-h-0 flex flex-col bg-gray-900 relative">
            <div id="roomStage" class="flex-1 min-h-0"></div>
        </div>

        <!-- 已離開診間 -->
        <div id="endedScreen" class="hidden flex-1 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-8 text-center">
                <div class="text-5xl mb-4" aria-hidden="true">✅</div>
                <h1 class="text-xl font-bold text-gray-800">你已離開診間</h1>
                <p class="text-sm text-gray-500 mt-3">如醫師要求重新連線，可再次進入。</p>
                <button
                    type="button"
                    id="rejoinRoomBtn"
                    class="mt-6 w-full inline-flex items-center justify-center gap-2 bg-green-600 hover:bg-green-700 text-white text-base font-semibold px-6 py-3 rounded-xl shadow transition duration-200"
                >
                    <span aria-hidden="true">🔄</span>重新進入診間
                </button>
            </div>
        </div>

    </div>

    <!-- 與醫師端共用：設定 → RTC SDK → 通話介面模組 → 病人端邏輯 -->
    <script src="agora-config.js"></script>
    <script src="agora-rtc-sdk.js"></script>
    <script src="agora-call.js"></script>
    <script src="room.js"></script>
</body>
</html>
