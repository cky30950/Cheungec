<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>目前離線 — 名醫診所系統</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
            background: linear-gradient(160deg, #F6EFE8 0%, #EADCCB 100%);
            color: #1E1E1E;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: #FFFFFF;
            border-radius: 24px;
            box-shadow: 0 24px 60px -20px rgba(142, 78, 25, 0.28);
            max-width: 420px;
            width: 100%;
            padding: 44px 36px 36px;
            text-align: center;
        }
        .icon {
            width: 88px;
            height: 88px;
            border-radius: 22px;
            background: linear-gradient(135deg, #E89350 0%, #8E4E19 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }
        .icon svg { width: 44px; height: 44px; }
        h1 {
            font-size: 1.4rem;
            color: #8E4E19;
            margin-bottom: 12px;
            font-weight: 700;
        }
        p {
            font-size: 0.98rem;
            line-height: 1.7;
            color: #5C5048;
            margin-bottom: 8px;
        }
        .hint { font-size: 0.85rem; color: #9A8B7E; }
        .actions {
            margin-top: 28px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        button, a.secondary {
            display: block;
            width: 100%;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        button {
            border: none;
            background: linear-gradient(135deg, #D9782B 0%, #B8621F 100%);
            color: #FFFFFF;
            box-shadow: 0 10px 24px -10px rgba(184, 98, 31, 0.7);
        }
        button:active { transform: translateY(1px); }
        a.secondary {
            background: #F6EFE8;
            color: #8E4E19;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="1" y1="1" x2="23" y2="23"></line>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>
        </div>
        <h1>目前無法連線</h1>
        <p>您的裝置目前離線。先前開啟過的頁面可在恢復連線後重新載入。</p>
        <p class="hint">若您正在編輯病歷，已快取的變更會在連線恢復後自動同步。</p>
        <div class="actions">
            <button type="button" onclick="location.reload()">重新連線並重試</button>
            <a class="secondary" href="/index.html">返回首頁</a>
        </div>
    </div>
</body>
</html>
