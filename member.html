<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <meta name="theme-color" content="#0d9488">
    <link rel="apple-touch-icon" href="/images/icons/apple-touch-icon.png">
    <title>會員查詢 | Member Portal</title>
    <style>
        :root {
            --brand: #0d9488;
            --brand-dark: #0f766e;
            --brand-soft: #f0fdfa;
            --ink: #1f2937;
            --muted: #6b7280;
            --line: #e5e7eb;
            --danger: #dc2626;
            --warn: #b45309;
            --warn-bg: #fffbeb;
            --card: #ffffff;
            --bg: #f3f4f6;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang HK",
                         "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
        }
        .wrap {
            max-width: 560px;
            margin: 0 auto;
            padding: 24px 16px 64px;
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            color: var(--brand-dark);
        }
        .brand img { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; }
        .lang-btn {
            border: 1px solid var(--line);
            background: #fff;
            color: var(--muted);
            font-size: 13px;
            padding: 5px 12px;
            border-radius: 999px;
            cursor: pointer;
        }
        .lang-btn:active { background: var(--bg); }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        h1 { font-size: 22px; margin: 4px 0 6px; }
        h2 { font-size: 15px; margin: 0 0 12px; color: var(--ink); display: flex; align-items: center; gap: 6px; }
        .sub { font-size: 14px; color: var(--muted); margin: 0 0 18px; }

        label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
        input[type="tel"], input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            font-size: 16px; /* 防止 iOS 聚焦縮放 */
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fff;
            color: var(--ink);
        }
        input:focus { outline: 2px solid rgba(13,148,136,0.35); border-color: var(--brand); }
        .field { margin-bottom: 14px; }
        .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 13px 16px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: var(--brand);
            color: #fff;
        }
        .btn:disabled { opacity: .55; cursor: default; }
        .btn:active:not(:disabled) { background: var(--brand-dark); }
        .btn.ghost {
            background: #fff;
            color: var(--muted);
            border: 1px solid var(--line);
        }
        .btn.small { width: auto; padding: 8px 14px; font-size: 13px; }

        .msg { font-size: 13px; margin-top: 12px; display: none; }
        .msg.error { display: block; color: var(--danger); }
        .msg.info { display: block; color: var(--warn); background: var(--warn-bg); border: 1px solid #fde68a; padding: 10px 12px; border-radius: 10px; }

        .turnstile-box { margin: 4px 0 14px; min-height: 65px; display: flex; flex-direction: column; }
        #turnstileWidget { min-height: 65px; }
        #turnstileWidget iframe { width: 100%; }

        /* 資料頁 */
        .balance-hero {
            background: linear-gradient(135deg, var(--brand), var(--brand-dark));
            color: #fff;
            border-radius: 16px;
            padding: 22px 20px;
            margin-bottom: 16px;
        }
        .balance-hero .label { font-size: 13px; opacity: .85; }
        .balance-hero .amount { font-size: 34px; font-weight: 700; letter-spacing: .5px; margin-top: 2px; }
        .balance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
        .balance-grid .b {
            background: rgba(255,255,255,.14);
            border-radius: 12px;
            padding: 10px 12px;
        }
        .balance-grid .b .k { font-size: 12px; opacity: .85; }
        .balance-grid .b .v { font-size: 17px; font-weight: 600; margin-top: 2px; }

        .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
        .tab {
            border: 1px solid var(--line);
            background: #fff;
            color: var(--muted);
            font-size: 13px;
            padding: 7px 14px;
            border-radius: 999px;
            cursor: pointer;
        }
        .tab.active { background: var(--brand); border-color: var(--brand); color: #fff; }

        .pill {
            display: inline-block;
            font-size: 11px;
            padding: 2px 9px;
            border-radius: 999px;
            background: var(--brand-soft);
            color: var(--brand-dark);
            border: 1px solid #99f6e4;
        }
        .pill.gray { background: #f3f4f6; color: var(--muted); border-color: var(--line); }

        .list { list-style: none; margin: 0; padding: 0; }
        .list li {
            padding: 12px 0;
            border-bottom: 1px solid var(--line);
        }
        .list li:last-child { border-bottom: none; padding-bottom: 0; }
        .list li:first-child { padding-top: 0; }
        .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
        .name { font-size: 14px; font-weight: 600; }
        .meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
        .amt-pos { color: var(--brand-dark); font-weight: 600; white-space: nowrap; }
        .amt-neg { color: var(--ink); font-weight: 600; white-space: nowrap; }

        .empty { font-size: 13px; color: var(--muted); text-align: center; padding: 18px 0; }

        .footer-actions { margin-top: 20px; }
        .hidden { display: none !important; }

        @media (max-width: 380px) {
            .balance-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="topbar">
        <div class="brand">
            <img src="/images/myLogo.png" alt="">
            <span data-i18n="clinicName">名醫中醫診所</span>
        </div>
        <button class="lang-btn" id="langToggle" type="button">English</button>
    </div>

    <!-- 輸入電話查詢（無需驗證碼） -->
    <div id="authView">
        <div class="card">
            <h1 data-i18n="authTitle">會員查詢</h1>
            <p class="sub" data-i18n="authSub">輸入於診所登記之手機號碼，即可查閱儲值餘額、套票及交易記錄。</p>

            <div class="field">
                <label for="phoneInput" data-i18n="phoneLabel">手機號碼</label>
                <input type="tel" id="phoneInput" inputmode="tel" autocomplete="tel"
                       placeholder="9123 4567">
                <p class="hint" data-i18n="phoneHint">請輸入於診所登記之手機號碼。</p>
            </div>

            <div class="turnstile-box" id="turnstileBox">
                <div id="turnstileWidget"></div>
                <p class="hint hidden" id="turnstileNote"></p>
            </div>

            <button class="btn" id="lookupBtn" type="button" data-i18n="lookup" disabled>查詢</button>

            <div class="msg" id="authMsg"></div>
        </div>
    </div>

    <!-- 資料頁 -->
    <div id="dataView" class="hidden">
        <div class="balance-hero">
            <div class="label" data-i18n="totalBalance">儲值總餘額 (HKD)</div>
            <div class="amount" id="heroTotal">$0.00</div>
            <div class="balance-grid">
                <div class="b">
                    <div class="k" data-i18n="principal">本金餘額</div>
                    <div class="v" id="heroBalance">$0.00</div>
                </div>
                <div class="b">
                    <div class="k" data-i18n="bonus">贈送餘額</div>
                    <div class="v" id="heroBonus">$0.00</div>
                </div>
            </div>
        </div>

        <div class="tabs" id="patientTabs"></div>

        <div class="card">
            <h2>🎫 <span data-i18n="packages">有效套票</span></h2>
            <ul class="list" id="packageList"></ul>
        </div>

        <div class="card">
            <h2>📋 <span data-i18n="transactions">最近交易</span></h2>
            <ul class="list" id="txList"></ul>
        </div>

        <div class="footer-actions">
            <button class="btn ghost" id="backBtn" type="button" data-i18n="back">返回</button>
        </div>
    </div>
</div>

<script type="module" src="/member.js"></script>
</body>
</html>
