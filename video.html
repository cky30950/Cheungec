<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>視訊診症 - 名醫中醫診所</title>
    <link rel="icon" type="image/png" href="images/myLogo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="livekit_config.js?v=2"></script>
    <script src="livekit_room.js?v=2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-emerald-50 via-white to-teal-50 flex flex-col">

    <header class="w-full bg-white/80 backdrop-blur border-b border-emerald-100">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center gap-3">
            <img src="images/myLogo.png" alt="診所標誌" class="w-10 h-10 rounded-lg object-cover">
            <div>
                <h1 class="text-lg font-bold text-gray-800">名醫中醫診所</h1>
                <p class="text-xs text-gray-500">視訊診症</p>
            </div>
        </div>
    </header>

    <main class="flex-1 w-full max-w-5xl mx-auto px-4 py-6 flex flex-col">

        <!-- 加入前畫面 -->
        <section id="joinPanel" class="flex-1 flex items-center justify-center">
            <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-gray-100 p-6 sm:p-8">
                <div class="flex justify-center mb-4">
                    <div class="w-14 h-14 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-7 h-7">
                            <path d="m22 8-6 4 6 4V8Z"/>
                            <rect x="2" y="6" width="14" height="12" rx="2"/>
                        </svg>
                    </div>
                </div>
                <h2 class="text-xl font-bold text-gray-800 text-center mb-1">進入視訊診症室</h2>
                <p class="text-sm text-gray-500 text-center mb-6">醫師就緒後會自動接通，請先確認攝影機與麥克風權限。</p>

                <div id="joinError" class="hidden mb-4 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3"></div>

                <label for="patientNameInput" class="block text-sm font-medium text-gray-700 mb-2">您的姓名</label>
                <input id="patientNameInput" type="text" maxlength="40" autocomplete="name"
                       class="w-full border border-gray-300 rounded-lg px-4 py-2.5 mb-4 focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none"
                       placeholder="請輸入姓名">

                <button id="joinButton" type="button"
                        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-3 rounded-lg transition duration-200 flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z"/>
                    </svg>
                    <span id="joinButtonLabel">進入診症室</span>
                </button>

                <ul class="mt-6 text-xs text-gray-500 space-y-1.5">
                    <li>・建議使用 Chrome、Edge 或 Safari 最新版本瀏覽器。</li>
                    <li>・進入後如無畫面，請檢查網址列左邊的攝影機／麥克風權限。</li>
                    <li>・若遲遲未接通，請聯絡診所確認看診時間。</li>
                </ul>
            </div>
        </section>

        <!-- 視訊畫面 -->
        <section id="callPanel" class="hidden flex-1 flex flex-col">
            <div id="callStage" class="h-[72vh] sm:h-[78vh]"></div>
        </section>

    </main>

    <footer class="text-center text-xs text-gray-400 py-4">
        如無法進入，請致電診所櫃台協助。
    </footer>

    <script>
        (function () {
            'use strict';

            var params = new URLSearchParams(window.location.search);
            var room = (params.get('room') || '').trim();
            var code = (params.get('code') || '').trim();
            var presetName = (params.get('name') || '').trim();

            var joinPanel = document.getElementById('joinPanel');
            var callPanel = document.getElementById('callPanel');
            var nameInput = document.getElementById('patientNameInput');
            var joinButton = document.getElementById('joinButton');
            var joinButtonLabel = document.getElementById('joinButtonLabel');
            var joinError = document.getElementById('joinError');
            var callStage = document.getElementById('callStage');

            var session = null;
            var joining = false;

            nameInput.value = presetName;

            function showJoinError(message) {
                joinError.textContent = message;
                joinError.classList.remove('hidden');
            }

            function setJoining(state) {
                joining = state;
                joinButton.disabled = state;
                joinButton.classList.toggle('opacity-70', state);
                joinButton.classList.toggle('cursor-wait', state);
                joinButtonLabel.textContent = state ? '進入中…' : '進入診症室';
            }

            function backToJoin() {
                session = null;
                callStage.innerHTML = '';
                callPanel.classList.add('hidden');
                joinPanel.classList.remove('hidden');
                setJoining(false);
            }

            async function joinRoom() {
                if (joining) return;
                joinError.classList.add('hidden');

                var name = nameInput.value.trim();
                if (!name) {
                    showJoinError('請先輸入您的姓名。');
                    nameInput.focus();
                    return;
                }
                if (!room || !code) {
                    showJoinError('連結內容不完整，請向診所重新索取視訊連結。');
                    return;
                }
                var config = window.LIVEKIT_CONFIG;
                if (!config || !config.url || !config.tokenEndpoint || !window.LiveKitVideo) {
                    showJoinError('視訊模組載入失敗，請重新整理頁面後再試。');
                    return;
                }

                setJoining(true);

                var tokenData;
                try {
                    tokenData = await window.LiveKitVideo.requestToken(config.tokenEndpoint, {
                        role: 'patient',
                        room: room,
                        code: code,
                        name: name
                    });
                } catch (e) {
                    console.error('取得視訊憑證失敗', e);
                    showJoinError(e.message || '無法進入診症室，請稍後再試。');
                    setJoining(false);
                    return;
                }

                joinPanel.classList.add('hidden');
                callPanel.classList.remove('hidden');

                session = window.LiveKitVideo.createSession(callStage, {
                    mode: 'patient',
                    onLeave: function () {
                        backToJoin();
                    },
                    onError: function (message) {
                        console.warn('[視訊]', message);
                    }
                });

                try {
                    await session.connect(tokenData.url || config.url, tokenData.token);
                } catch (_e) {
                    // 失敗畫面由視訊核心顯示，並提供「返回」按鈕
                } finally {
                    setJoining(false);
                }
            }

            joinButton.addEventListener('click', function () { joinRoom(); });
            nameInput.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') joinRoom();
            });

            if (!room || !code) {
                showJoinError('這不是有效的視訊邀請連結，請改點診所提供的完整連結。');
                joinButton.disabled = true;
                joinButton.classList.add('opacity-50', 'cursor-not-allowed');
            }
        })();
    </script>
</body>
</html>
